<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>BEAT.HAHZ.LIVE · Beat Machine</title>

    <style>
        /* ─── Reset & Base ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            margin: 0;
        }

        /* ─── Main Card ─── */
        .beat-machine {
            background: linear-gradient(145deg, #13131a, #1a1a24);
            border-radius: 40px;
            padding: 32px 36px 40px;
            max-width: 900px;
            width: 100%;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.04),
                0 0 0 1px rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s;
        }

        /* ─── Header / Logo ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #c084fc, #7c3aed, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(124, 58, 237, 0.25);
            user-select: none;
        }
        .logo span {
            font-weight: 300;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #94a3b8, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bpm-display {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 18px 8px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bpm-display .value {
            font-size: 22px;
            font-weight: 700;
            color: #e2e8f0;
            min-width: 48px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .bpm-display .label {
            opacity: 0.6;
            font-size: 12px;
        }

        /* ─── Grid ─── */
        .grid-wrapper {
            position: relative;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 4px 4px 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        #grid {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px 6px 6px 0;
        }

        /* ─── Row ─── */
        .row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .row-label {
            width: 70px;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #64748b;
            text-align: right;
            padding-right: 14px;
            user-select: none;
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* ─── Beat Button ─── */
        button.beat {
            flex: 1;
            aspect-ratio: 1 / 0.85;
            min-height: 34px;
            background: rgba(255, 255, 255, 0.04);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            margin: 0;
            padding: 0;
        }

        button.beat::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.06), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        button.beat:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }
        button.beat:hover::after {
            opacity: 1;
        }

        /* Active (programmed) */
        button.beat.on {
            background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed);
            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-color: transparent;
        }
        button.beat.on::after {
            opacity: 0.6;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), transparent 70%);
        }

        /* Current step highlight (ticked) */
        button.beat.ticked {
            box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.5), 0 0 30px rgba(124, 58, 237, 0.15);
            transform: scale(1.04);
            z-index: 2;
        }

        button.beat.ticked.on {
            box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.7), 0 0 40px rgba(124, 58, 237, 0.35);
        }

        /* ─── Footer Controls ─── */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', system-ui, sans-serif;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border-color: rgba(124, 58, 237, 0.3);
            color: #fff;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.2);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border-color: rgba(124, 58, 237, 0.5);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.3);
            color: #fff;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.25);
            color: #fecaca;
        }

        .status-text {
            color: #475569;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.6;
        }

        /* ─── Responsive ─── */
        @media (max-width: 700px) {
            .beat-machine {
                padding: 20px 16px 28px;
                border-radius: 28px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding-bottom: 12px;
            }
            .logo {
                font-size: 22px;
            }
            .bpm-display {
                font-size: 12px;
                padding: 6px 14px 6px 12px;
            }
            .bpm-display .value {
                font-size: 18px;
                min-width: 36px;
            }
            .row-label {
                width: 48px;
                font-size: 9px;
                padding-right: 8px;
            }
            button.beat {
                min-height: 26px;
                border-radius: 6px;
            }
            .footer {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .footer-actions {
                justify-content: center;
                flex-wrap: wrap;
            }
            .btn {
                font-size: 12px;
                padding: 6px 14px;
            }
        }

        @media (max-width: 420px) {
            .beat-machine {
                padding: 14px 10px 20px;
                border-radius: 20px;
            }
            .row-label {
                width: 36px;
                font-size: 8px;
                padding-right: 4px;
            }
            button.beat {
                min-height: 18px;
                border-radius: 4px;
            }
            .logo {
                font-size: 18px;
            }
            .bpm-display .value {
                font-size: 15px;
                min-width: 30px;
            }
        }

        /* ─── Scrollable grid on tiny screens ─── */
        .grid-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
        }
        .grid-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .grid-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }
        .grid-scroll::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.3);
            border-radius: 8px;
        }

        /* ─── Animations ─── */
        @keyframes pulse-glow {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        .beat.ticked {
            animation: pulse-glow 0.6s ease-in-out infinite;
        }

        /* ─── Live indicator dot ─── */
        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 8px;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
            animation: pulse-dot 1.4s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.85);
            }
        }
    </style>
</head>
<body>

    <div class="beat-machine">

        <!-- ─── Header ─── -->
        <div class="header">
            <div class="logo">
                BEAT<span>.HAHZ.LIVE</span>
            </div>
            <div class="bpm-display">
                <span class="live-dot"></span>
                <span class="label">BPM</span>
                <span class="value" id="bpmValue">120</span>
            </div>
        </div>

        <!-- ─── Grid ─── -->
        <div class="grid-scroll">
            <div class="grid-wrapper">
                <div id="grid"></div>
            </div>
        </div>

        <!-- ─── Footer ─── -->
        <div class="footer">
            <div class="footer-actions">
                <button class="btn btn-danger" id="clearBtn">✕ Clear Grid</button>
                <button class="btn" id="loadBtn">↻ Load Beat</button>
                <button class="btn btn-primary" id="randomBtn">✦ Random</button>
            </div>
            <span class="status-text" id="statusText">● live · 16 steps</span>
        </div>

    </div>

    <script>
        // ─── Configuration ───
        const BPM = 120;
        const TICKS = 16;
        const INTERVAL = 1 / (4 * BPM / (60 * 1000));
        const MAX_BITS = 32;
        const MAX_HEX = MAX_BITS / 4;

        // ─── Sound Bank ───
        const sounds = [
            'sounds/bass_drum.wav',
            'sounds/snare_drum.wav',
            'sounds/low_tom.wav',
            'sounds/mid_tom.wav',
        ];

        const soundLabels = ['Kick', 'Snare', 'Low Tom', 'Mid Tom'];

        // ─── Audio Context ───
        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        const buffers = [];
        const gridEl = document.getElementById('grid');

        // ─── Helpers ───
        function binToHex(bin) {
            let hex = '';
            for (let i = 0, len = bin.length; i < len; i += MAX_BITS) {
                let tmp = parseInt(bin.substr(i, MAX_BITS), 2).toString(16);
                while (tmp.length < MAX_HEX) tmp = '0' + tmp;
                hex += tmp;
            }
            return hex;
        }

        function hexToBin(hex) {
            let bin = '';
            for (let i = 0, len = hex.length; i < len; i += MAX_HEX) {
                let tmp = parseInt(hex.substr(i, MAX_HEX), 16).toString(2);
                while (tmp.length < MAX_BITS) tmp = '0' + tmp;
                bin += tmp;
            }
            return bin;
        }

        // ─── State ───
        let beats = [];

        function updateState() {
            let state = '';
            beats.forEach(btn => { state += btn.classList.contains('on') ? '1' : '0'; });
            window.location.hash = binToHex(state);
        }

        function restoreState() {
            let hash = window.location.hash;
            hash = (hash === '') ? '0000000000000000' : hash.substr(1);
            const bin = hexToBin(hash);
            beats.forEach((btn, i) => {
                if (parseInt(bin[i]) === 1) btn.classList.add('on');
                else btn.classList.remove('on');
            });
        }

        window.addEventListener('hashchange', restoreState, false);

        // ─── Build Grid ───
        const sLen = sounds.length;

        // Load sounds
        for (let i = 0; i < sLen; i++) {
            (function(index) {
                const req = new XMLHttpRequest();
                req.open('GET', sounds[index], true);
                req.responseType = 'arraybuffer';
                req.onload = function() {
                    audioCtx.decodeAudioData(req.response, function(buffer) {
                        buffers.push(buffer);
                    });
                };
                req.send();
            })(i);
        }

        // Build rows
        for (let row = 0; row < sLen; row++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';

            const label = document.createElement('span');
            label.className = 'row-label';
            label.textContent = soundLabels[row] || `CH ${row + 1}`;
            rowDiv.appendChild(label);

            for (let t = 0; t < TICKS; t++) {
                const btn = document.createElement('button');
                btn.className = 'beat';
                btn.dataset.row = row;
                btn.dataset.col = t;
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    this.classList.toggle('on');
                    updateState();
                }, false);
                rowDiv.appendChild(btn);
            }

            gridEl.appendChild(rowDiv);
        }

        beats = document.querySelectorAll('.beat');

        // ─── Drum Loop ───
        let lastTick = TICKS - 1;
        let curTick = 0;
        let lastTime = new Date().getTime();

        function drumLoop() {
            const curTime = new Date().getTime();

            if (curTime - lastTime >= INTERVAL) {
                for (let i = 0; i < sLen; i++) {
                    const lastBeat = beats[i * TICKS + lastTick];
                    const curBeat = beats[i * TICKS + curTick];

                    if (lastBeat) lastBeat.classList.remove('ticked');
                    if (curBeat) curBeat.classList.add('ticked');

                    if (curBeat && curBeat.classList.contains('on')) {
                        try {
                            if (buffers[i]) {
                                const source = audioCtx.createBufferSource();
                                source.buffer = buffers[i];
                                source.connect(audioCtx.destination);
                                source.start();
                            } else {
                                // fallback
                                new Audio(sounds[i]).play();
                            }
                        } catch (e) {
                            new Audio(sounds[i]).play();
                        }
                    }
                }

                lastTick = curTick;
                curTick = (curTick + 1) % TICKS;
                lastTime = curTime;
            }
            requestAnimationFrame(drumLoop);
        }

        restoreState();
        requestAnimationFrame(drumLoop);

        // ─── iOS Audio Wake ───
        function enableIOSAudio() {
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start();
            window.removeEventListener('touchend', enableIOSAudio, false);
        }
        window.addEventListener('touchend', enableIOSAudio, false);

        // ─── Controls ───
        document.getElementById('clearBtn').addEventListener('click', function() {
            beats.forEach(btn => btn.classList.remove('on'));
            updateState();
        });

        document.getElementById('loadBtn').addEventListener('click', function() {
            // reload from URL hash
            restoreState();
            // force re-tick visual
            beats.forEach(b => b.classList.remove('ticked'));
        });

        document.getElementById('randomBtn').addEventListener('click', function() {
            beats.forEach(btn => {
                if (Math.random() > 0.55) btn.classList.add('on');
                else btn.classList.remove('on');
            });
            updateState();
        });

        // ─── BPM display ───
        document.getElementById('bpmValue').textContent = BPM;

        // ─── Status ───
        document.getElementById('statusText').textContent = '● live · ' + TICKS + ' steps · ' + sLen + ' tracks';
    </script>

</body>
</html>
